<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KibueFx Glossary</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary-color: #0066ff;
      --secondary-color: #00bfff;
      --accent-color: #ff6b6b;
      --dark-bg: #0f1419;
      --light-bg: #ffffff;
      --border-radius: 20px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 1rem;
      min-height: 100vh;
    }

    /* Navigation Tabs */
    .nav-container {
      width: 100%;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 1rem 0;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      position: sticky;
      top: 0;
      z-index: 1000;
      border-radius: 0 0 var(--border-radius) var(--border-radius);
      margin: -1rem -1rem 2rem -1rem;
    }

    .nav-tabs {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1rem;
    }

    .nav-tab {
      padding: 0.8rem 1.5rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      transition: var(--transition);
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
      text-decoration: none;
      display: inline-block;
    }

    .nav-tab:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
      background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
    }

    .nav-tab.active {
      background: linear-gradient(135deg, #ff6b6b 0%, #ff8e53 100%);
      box-shadow: 0 8px 25px rgba(255, 107, 107, 0.4);
    }

    .glossary-container {
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 2rem;
      font-size: clamp(1.8rem, 5vw, 2.5rem);
      color: white;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
      font-weight: 800;
    }

    input[type="text"] {
      width: 100%;
      padding: 1rem;
      margin-bottom: 2rem;
      border: none;
      border-radius: 50px;
      background: rgba(255, 255, 255, 0.95);
      color: #1a1a1a;
      font-size: clamp(0.9rem, 3vw, 1rem);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
      transition: var(--transition);
      font-weight: 500;
    }

    input[type="text"]:focus {
      outline: none;
      background: white;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.2);
      transform: scale(1.01);
    }

    input[type="text"]::placeholder {
      color: #999;
    }

    .glossary-list {
      display: grid;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .term {
      padding: 1.5rem;
      border-left: 5px solid var(--accent-color);
      background: rgba(255, 255, 255, 0.95);
      border-radius: 15px;
      transition: var(--transition);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
      cursor: pointer;
    }

    .term:hover {
      transform: translateY(-5px) translateX(5px);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.15);
      background: white;
    }

    .term h3 {
      margin-bottom: 0.8rem;
      color: #667eea;
      font-size: clamp(1.1rem, 3.5vw, 1.4rem);
      font-weight: 700;
    }

    .term p {
      color: #333;
      font-size: clamp(0.85rem, 2.5vw, 1rem);
      line-height: 1.6;
      margin: 0;
    }

    #nextButton {
      display: block;
      width: 100%;
      max-width: 250px;
      margin: 2rem auto;
      padding: 1rem;
      background: linear-gradient(135deg, #ff6b6b 0%, #ff8e53 100%);
      color: white;
      border: none;
      border-radius: 50px;
      font-weight: bold;
      font-size: clamp(0.9rem, 3vw, 1.1rem);
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 6px 20px rgba(255, 107, 107, 0.3);
    }

    #nextButton:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(255, 107, 107, 0.4);
    }

    #nextButton:active {
      transform: translateY(0);
    }

    #nextMessage {
      margin-top: 1.5rem;
      text-align: center;
      color: #ffeb3b;
      font-weight: bold;
      font-size: clamp(0.85rem, 2.5vw, 1rem);
      animation: slideUp 0.3s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    footer {
      margin-top: 3rem;
      padding: 2rem 1rem;
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.85);
      text-align: center;
      background: rgba(0, 0, 0, 0.1);
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: var(--border-radius);
    }

    @media (max-width: 600px) {
      body {
        padding: 0.5rem;
      }

      .glossary-container {
        width: 95%;
      }

      h1 {
        margin-bottom: 1.5rem;
      }

      input[type="text"] {
        padding: 0.8rem;
        margin-bottom: 1.5rem;
      }

      .term {
        padding: 1.2rem;
        margin-bottom: 1rem;
      }

      #nextButton {
        max-width: 200px;
        padding: 0.8rem;
      }

      .nav-tabs {
        gap: 0.5rem;
      }

      .nav-tab {
        padding: 0.6rem 1.2rem;
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <!-- Navigation Tabs -->
  <nav class="nav-container">
    <div class="nav-tabs">
      <a href="index.html" class="nav-tab">🏠 Home</a>
      <a href="gloss.html" class="nav-tab active">📚 Glossary</a>
      <a href="ict_trade_setup.html" class="nav-tab">📊 Trading Setup</a>
      <a href="notebooklm.html" class="nav-tab">📝 Resources</a>
      <a href="signup.html" class="nav-tab">🔐 Join Us</a>
    </div>
  </nav>

  <div class="glossary-container">
    <h1>📖 Forex Glossary</h1>
    <input type="text" id="searchBox" placeholder="🔍 Search for a trading term...">
    <div id="glossaryList" class="glossary-list"></div>
    <button id="nextButton">Next: Trading Setup →</button>
    <div id="nextMessage"></div>
  </div>

  <footer role="contentinfo">
    <p>&copy; 2026 KibueFx Landers. All rights reserved.</p>
  </footer>

  <script>
    const glossary = [
      { term: "Account Currency", definition: "The currency chosen for a trading account, into which all profits, losses, and fees are converted. For example, if the account is in USD but funds are in EUR, all P/L is converted to USD." },
      { term: "Ask Price (Offer Price)", definition: "The price at which a trader can buy the base currency in a currency pair, shown on the right side of a quote. For example, in EUR/USD at 1.1965/1.1967, the ask is 1.1967." },
      { term: "Bid Price", definition: "The price at which a trader can sell the base currency in a currency pair, shown on the left side of a quote. For example, in EUR/USD at 1.4568/1.4570, the bid is 1.4568." },
      { term: "Close a Position", definition: "Exiting an open trade to realize profit or loss. For example, closing a long EUR/USD position after the euro rises locks in the profit by selling the euros." },
      { term: "Contract Sizes (Lots)", definition: "Standardized trading amounts in forex, measured in lots. A standard lot is 100,000 units of the base currency, a mini lot is 10,000 units, and a micro lot is 1,000 units." },
      { term: "Country Risk", definition: "The risk that a government restricts or controls its currency's flow, impacting forex trading. This risk is higher with exotic currencies than with major pairs." },
      { term: "Credit Risk", definition: "The risk that one party in a forex transaction, such as a bank, fails to honor their debt at deal closure, often due to insolvency." },
      { term: "Currency Pair", definition: "A quotation of one currency against another, showing their relative value. The first currency is the base, the second is the quote currency. EUR/USD means 1 euro = X US dollars." },
      { term: "Equity", definition: "The total value of a trading account, including deposits, profits, and losses. For example, a $10,000 deposit plus a $3,000 profit results in $13,000 equity." },
      { term: "Exchange Rate", definition: "The rate at which one currency is exchanged for another, showing how much quote currency is needed for one unit of base currency." },
      { term: "Exchange Rate Risk", definition: "The risk of rapid currency price fluctuations during trading, which can cause significant losses unless mitigated by stop-loss orders." },
      { term: "Execution", definition: "The process of completing a trade order. Orders are sent to a broker, who fills, rejects, or re-quotes them. Fast execution is critical in forex." },
      { term: "Fractional Pip (Pipette)", definition: "An extra decimal place in an exchange rate for greater pricing precision. For non-JPY pairs, it's five decimal places (e.g., 1.23456)." },
      { term: "Fraud", definition: "The risk of deceptive practices by some brokers, though reduced by regulations. Traders should verify brokers' registration with bodies like the CFTC or NFA." },
      { term: "Free Margin", definition: "The amount of money in a trading account available for new positions, calculated as Equity minus Used Margin." },
      { term: "Good For the Day (GFD)", definition: "An order active until the end of the trading day, typically 5 PM EST in the 24-hour forex market." },
      { term: "Good till Canceled (GTC)", definition: "An order to buy or sell at a set price, active until the trader cancels it or it's executed." },
      { term: "Interest Rate Risk", definition: "The risk from differences in interest rates between the two currencies in a pair, affecting trade profitability." },
      { term: "Leverage", definition: "A broker's loan allowing traders to control larger positions with less capital. For example, 100:1 leverage means $1,000 controls $100,000." },
      { term: "Limit Order", definition: "An order to buy below or sell above the current market price, executed only at the specified price or better to avoid slippage." },
      { term: "Liquidity Risk", definition: "The risk of reduced liquidity in a currency pair, often due to unexpected economic or political events, causing sharp or volatile price movements." },
      { term: "Long Position", definition: "Buying the base currency, expecting it to rise in value. For example, in a long EUR/USD position, the trader buys euros." },
      { term: "Margin", definition: "The minimum funds, as a percentage, required to open or maintain a position. For example, a 1% margin means $1,000 is needed to trade $100,000." },
      { term: "Margin Call", definition: "A broker's notification when equity falls below a required margin level due to adverse market movements. Additional funds are needed to maintain positions." },
      { term: "Market Order", definition: "An order to buy or sell a currency pair instantly at the best available market price, prioritizing execution over price certainty." },
      { term: "Market Risk", definition: "The risk of losses from price movements in a currency pair, driven by economic or political changes." },
      { term: "One Cancels the Other (OCO)", definition: "Two orders on either side of the current market price. If one is executed, the other is canceled, preventing conflicting trades." },
      { term: "Open Order", definition: "An order to buy or sell a financial instrument that remains active until manually closed by the trader or broker." },
      { term: "Pip", definition: "The smallest price change in a currency pair's exchange rate, usually the fourth decimal for most pairs (e.g., 1.2550 to 1.2551)." },
      { term: "Pip Value", definition: "The monetary value of a 1-pip movement, varying by pair and account currency." },
      { term: "Position", definition: "An open trade held for a period, either long (buying) or short (selling) the base currency." },
      { term: "Quote", definition: "The market price of a currency pair, showing bid (selling) and ask (buying) prices." },
      { term: "Short Position", definition: "Selling the base currency, expecting it to fall in value. For example, in a short EUR/USD position, the trader sells euros." },
      { term: "Slippage", definition: "The difference between the expected and actual trade price, often in low-liquidity or volatile markets." },
      { term: "Spread", definition: "The difference between bid and ask prices, measured in pips, representing brokerage costs. Spreads can be fixed or variable." },
      { term: "Stop-Loss Order", definition: "An order to close a trade at a specified loss level to limit losses. For example, a stop-loss at 1.4150 limits losses." },
      { term: "Take Profit Order", definition: "An order to close a trade at a specified profit level, securing gains when targets are reached." },
      { term: "Trailing Stop Order", definition: "A stop order that adjusts dynamically to lock in profits while limiting losses as price moves favorably." },
      { term: "Used Margin", definition: "The amount of money reserved by the broker to keep current trading positions open." }
    ];

    function renderGlossary(filter = "") {
      const list = document.getElementById("glossaryList");
      list.innerHTML = "";
      const filtered = glossary.filter(entry => entry.term.toLowerCase().includes(filter.toLowerCase()));
      
      if (filtered.length === 0) {
        list.innerHTML = "<p style='text-align: center; color: white; font-size: 1.1rem; padding: 2rem;'>No terms found. Try a different search!</p>";
        return;
      }

      filtered.forEach(entry => {
        const div = document.createElement("div");
        div.className = "term";
        div.innerHTML = `<h3>${entry.term}</h3><p>${entry.definition}</p>`;
        list.appendChild(div);
      });
    }

    document.getElementById("searchBox").addEventListener("input", function() {
      renderGlossary(this.value);
    });

    document.getElementById("nextButton").addEventListener("click", function () {
      window.location.href = "ict_trade_setup.html";
    });

    renderGlossary();
  </script>

</body>
</html>
